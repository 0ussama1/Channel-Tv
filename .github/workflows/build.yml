name: Build Android APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo apt-get clean

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev lld openjdk-17-jdk shared-mime-info autoconf automake libtool pkg-config zlib1g-dev libffi-dev libssl-dev libltdl-dev expect libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev
          pip install --upgrade pip
          pip install buildozer
          # ترك إصدار الكابوس القديم وتثبيت النسخة الحديثة المتوافقة جينياً مع بايثون 3.11
          pip install "cython>=3.0.0"

      - name: Pre-Accept Android SDK Licenses
        run: |
          mkdir -p ~/.android
          touch ~/.android/repositories.cfg
          expect -c "
            set timeout -1
            spawn buildozer android licenses
            expect {
              \"*Accept?*\" { send \"y\r\"; exp_continue }
              eof
            }
          " || true

      - name: Generate Fresh Target Specification
        run: |
          rm -f buildozer.spec
          cat << 'SPEC' > buildozer.spec
          [app]
          title = Sat Channel Editor Pro
          package.name = satchanneleditor
          package.domain = org.oussama1
          source.dir = .
          source.include_exts = py,png,jpg,kv,atlas,txt,m3u,cfg
          version = 1.0.0
          
          # التوليفة الذهبية المتوافقة بالكامل مع السيرفرات الحديثة لـ Ubuntu
          requirements = python3==3.11.9,kivy==2.3.0,kivymd==1.2.0,plyer,pillow
          
          orientation = portrait
          fullscreen = 0
          android.api = 33
          android.minapi = 24
          android.build_tools_version = 33.0.1
          android.archs = arm64-v8a
          android.private_storage = True
          android.accept_sdk_license = True
          android.permissions = READ_EXTERNAL_STORAGE,WRITE_EXTERNAL_STORAGE
          
          [buildozer]
          log_level = 2
          warn_on_root = 1
          SPEC

      - name: Force Pure Clean Build
        run: |
          # نسف جذري وشامل لكافة مخلفات البناء القديمة والعالقة في كاش السيرفر
          rm -rf ~/.buildozer
          rm -rf .buildozer
          rm -rf ~/.local/share/python-for-android
          
          export BUILDOZER_HOME="/home/runner/work/Channel-Tv/Channel-Tv/.buildozer"
          buildozer android debug
          
      - name: Upload Finished APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SatChannelEditor-Pro-APK
          path: bin/*.apk
