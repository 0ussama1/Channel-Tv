name: Build Android APK via Docker
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    # استخدام حاوية Docker مجهزة ومستقرة لحل مشاكل المترجم تماماً
    container:
      image: docker://bakinganytime/buildozer:latest
    
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Generate Fresh Specification
        run: |
          rm -f buildozer.spec
          cat << 'SPEC' > buildozer.spec
          [app]
          title = Sat Channel Editor Pro
          package.name = satchanneleditor
          package.domain = org.oussama1
          source.dir = .
          source.include_exts = py,png,jpg,kv,atlas,txt,m3u,cfg
          version = 1.0.0
          
          # المتطلبات الافتراضية الآمنة داخل الحاوية
          requirements = python3,kivy==2.3.0,kivymd==1.2.0,plyer
          
          orientation = portrait
          fullscreen = 0
          android.api = 33
          android.minapi = 24
          android.build_tools_version = 33.0.1
          android.archs = arm64-v8a
          android.private_storage = True
          android.accept_sdk_license = True
          android.permissions = READ_EXTERNAL_STORAGE,WRITE_EXTERNAL_STORAGE
          
          [buildozer]
          log_level = 2
          warn_on_root = 1
          SPEC

      - name: Build Android APK inside Container
        run: |
          # البناء مباشرة مستفيداً من أدوات الحاوية المعزولة
          buildozer android debug

      - name: Upload Finished APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SatChannelEditor-Pro-APK
          path: bin/*.apk
