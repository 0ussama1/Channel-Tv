name: Build Android APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Actions
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Buildozer and Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev lld openjdk-17-jdk shared-mime-info autoconf automake libtool pkg-config zlib1g-dev libffi-dev libssl-dev
          pip install --upgrade pip
          pip install buildozer cython==0.29.36

      - name: Pre-accept Android SDK Licenses
        run: |
          mkdir -p ~/.android
          touch ~/.android/repositories.cfg
          # استخدام سكريبت لإجبار النظام على قبول رخص جوجل والـ SDK المسبقة
          yes | buildozer android licenses || true

      - name: Initialize Buildozer Specification
        run: |
          buildozer init
          # ضبط الإعدادات وإجبار الأدوات على استخدام إصدار مستقر وآمن (API 33 و Build Tools 33)
          sed -i 's/title = My Application/title = Sat Channel Editor Pro/g' buildozer.spec
          sed -i 's/package.name = myapp/package.name = satchanneleditor/g' buildozer.spec
          sed -i 's/package.domain = org.test/package.domain = org.oussama1/g' buildozer.spec
          sed -i 's/requirements = python3,kivy/requirements = python3,kivy==2.3.0,kivymd==1.2.0,plyer/g' buildozer.spec
          sed -i 's/#android.permissions =/android.permissions = READ_EXTERNAL_STORAGE,WRITE_EXTERNAL_STORAGE/g' buildozer.spec
          sed -i 's/#android.accept_sdk_license = False/android.accept_sdk_license = True/g' buildozer.spec
          sed -i 's/#android.api = 33/android.api = 33/g' buildozer.spec
          sed -i 's/#android.build_tools_version =/android.build_tools_version = 33.0.1/g' buildozer.spec

      - name: Build Android APK with Buildozer
        run: |
          # تمرير أمر الموافقة المسبقة أوتوماتيكياً أثناء التجميع
          yes | buildozer android debug

      - name: Upload Finished APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SatChannelEditor-Pro-APK
          path: bin/*.apk
