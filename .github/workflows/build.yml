name: Build Android APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Free Disk Space for Safe Heavy Compilation
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo apt-get clean

      - name: Setup Dynamic Python 3.11 Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Pure System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev libsqlite3-dev lld shared-mime-info libltdl-dev expect libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev curl
          python -m pip install --upgrade pip
          pip install "cython<3.0.0"
          pip install buildozer==1.5.0

      - name: Hardcode Local Paths into Buildozer Spec
        run: |
          rm -f buildozer.spec
          cat << 'SPEC' > buildozer.spec
          [app]
          title = Sat Channel Editor Pro
          package.name = satchannelpro
          package.domain = org.oussama.sat
          source.dir = .
          source.include_exts = py,png,jpg,kv,atlas,txt,m3u,cfg
          version = 1.0.1
          
          requirements = python3==3.11.9,kivy==2.3.0,kivymd==1.2.0,plyer,pillow
          
          orientation = portrait
          fullscreen = 0
          
          android.sdk_path = ${{ github.workspace }}/.buildozer/android/platform/android-sdk
          android.ndk_path = ${{ github.workspace }}/.buildozer/android/platform/android-ndk-r25b
          
          android.api = 33
          android.minapi = 24
          android.build_tools_version = 33.0.1
          android.archs = arm64-v8a
          android.private_storage = True
          android.accept_sdk_license = True
          android.permissions = READ_EXTERNAL_STORAGE,WRITE_EXTERNAL_STORAGE,INTERNET
          
          [buildozer]
          log_level = 2
          warn_on_root = 1
          SPEC

      - name: Native Forced CI Environment Emulation Build
        run: |
          rm -rf ~/.buildozer
          rm -rf .buildozer
          mkdir -p .buildozer/android/platform/android-sdk/licenses
          
          # حقن الهوية الرقمية الشاملة لتراخيص أندرويد لقتل أي فحص صامت
          echo -e "\n8933bad161ad4178b1185d1a37fbf41ea5269c55\nd56f17341aa5e035785661bcb3d96d8c34782287\n24333f1a63b68bfa3a3725a0787ec0010db18e11\n84831b9409646a918e30573bab4c9c91346d8abd\n35dbf975087addb003b03833e73f4b0366ec3091\ne9ac305950a34348f1a5111e2546dd8d4b26b873" > .buildozer/android/platform/android-sdk/licenses/android-sdk-license
          echo -e "\n84831b9409646a918e30573bab4c9c91346d8abd" > .buildozer/android/platform/android-sdk/licenses/android-sdk-preview-license
          
          # كسر الحصار البيئي وإجبار الأداة على العمل كأنها داخل حاسوب محلي مفتوح
          export BUILDOZER_HOME="${{ github.workspace }}/.buildozer"
          export BUILDOZER_BIN="${{ github.workspace }}/bin"
          export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
          
          # متغيرات التصفية والالتفاف لمنع الانهيار الصامت
          export CI=false
          export GITHUB_ACTIONS=false
          export NONINTERACTIVE=0
          
          # استدعاء التجميع المباشر عبر محاكي التفاعل لضمان تخطي عقبة الـ TTY
          yes | buildozer android debug || buildozer android debug
          
      - name: Upload Finished APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SatChannelEditor-Pro-APK
          path: bin/*.apk
