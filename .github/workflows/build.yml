name: Build Android APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo apt-get clean

      - name: Setup Unified Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev lld openjdk-17-jdk shared-mime-info autoconf automake libtool pkg-config zlib1g-dev libffi-dev libssl-dev libltdl-dev expect libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev curl
          python -m pip install --upgrade pip
          pip install "cython<3.0.0"
          pip install buildozer==1.5.0

      - name: Pre-Accept Android SDK Licenses
        run: |
          mkdir -p ~/.android
          touch ~/.android/repositories.cfg
          expect -c "
            set timeout -1
            spawn buildozer android licenses
            expect {
              \"*Accept?*\" { send \"y\r\"; exp_continue }
              eof
            }
          " || true

      - name: Generate Sealed Buildozer Specification
        run: |
          rm -f buildozer.spec
          cat << 'SPEC' > buildozer.spec
          [app]
          title = Sat Channel Editor Pro
          package.name = satchannelpro
          package.domain = org.oussama.sat
          source.dir = .
          source.include_exts = py,png,jpg,kv,atlas,txt,m3u,cfg
          version = 1.0.1
          
          requirements = python3==3.11.9,kivy==2.3.0,kivymd==1.2.0,plyer,pillow
          
          orientation = portrait
          fullscreen = 0
          android.api = 33
          android.minapi = 24
          android.build_tools_version = 33.0.1
          android.archs = arm64-v8a
          android.private_storage = True
          android.accept_sdk_license = True
          android.permissions = READ_EXTERNAL_STORAGE,WRITE_EXTERNAL_STORAGE
          
          [buildozer]
          log_level = 2
          warn_on_root = 1
          SPEC

      - name: Absolute Workspace Build Execution
        run: |
          # تطهير جذري للمسارات الافتراضية المقيدة للمستخدم العادي
          rm -rf ~/.buildozer
          rm -rf .buildozer
          mkdir -p .buildozer/android/platform
          
          # فرض متغيرات بيئة مطلقة ومستقرة تجبر التجميع محلياً بالكامل
          export BUILDOZER_HOME="${GITHUB_WORKSPACE}/.buildozer"
          export BUILDOZER_BIN="${GITHUB_WORKSPACE}/bin"
          export P4A_HOME="${GITHUB_WORKSPACE}/.buildozer/android/platform/python-for-android"
          
          # تفعيل وضع عدم التفاعل الصارم لمنع انهيار الـ TTY
          export NONINTERACTIVE=1
          export STTY_CLEAN=1
          
          # تشغيل أمر البناء النهائي مع حظر أي تداخل للصلاحيات
          buildozer android debug
          
      - name: Upload Finished APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SatChannelEditor-Pro-APK
          path: bin/*.apk
