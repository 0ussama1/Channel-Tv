name: Build Android APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Unified Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev lld openjdk-17-jdk shared-mime-info autoconf automake libtool pkg-config zlib1g-dev libffi-dev libssl-dev libltdl-dev expect libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev curl
          python -m pip install --upgrade pip
          pip install "cython<3.0.0"
          pip install buildozer==1.5.0

      - name: Hardcode Local Paths into Buildozer Spec
        run: |
          rm -f buildozer.spec
          cat << 'SPEC' > buildozer.spec
          [app]
          title = Sat Channel Editor Pro
          package.name = satchannelpro
          package.domain = org.oussama.sat
          source.dir = .
          source.include_exts = py,png,jpg,kv,atlas,txt,m3u,cfg
          version = 1.0.1
          
          requirements = python3==3.11.9,kivy==2.3.0,kivymd==1.2.0,plyer,pillow
          
          orientation = portrait
          fullscreen = 0
          
          # فرض تحديد يدوي صارم لتخطي قيم السيرفر الجبرية
          android.sdk_path = ${{ github.workspace }}/.buildozer/android/platform/android-sdk
          android.ndk_path = ${{ github.workspace }}/.buildozer/android/platform/android-ndk-r25b
          
          android.api = 33
          android.minapi = 24
          android.build_tools_version = 33.0.1
          android.archs = arm64-v8a
          android.private_storage = True
          android.accept_sdk_license = True
          android.permissions = READ_EXTERNAL_STORAGE,WRITE_EXTERNAL_STORAGE
          
          [buildozer]
          log_level = 2
          warn_on_root = 1
          SPEC

      - name: Free Space and Build Execution
        run: |
          # تنظيف أي مخلفات قديمة لبدء بناء محلي نقي
          rm -rf ~/.buildozer
          rm -rf .buildozer
          mkdir -p .buildozer/android/platform
          
          # حقن المتغيرات الاحتياطية لتأكيد العزل والتحجيم الكامل للمترجم
          export BUILDOZER_HOME="${{ github.workspace }}/.buildozer"
          export BUILDOZER_BIN="${{ github.workspace }}/bin"
          export NONINTERACTIVE=1
          export STTY_CLEAN=1
          
          # قبول التراخيص داخلياً وإطلاق التجميع النهائي
          yes | buildozer android licenses || true
          buildozer android debug

      - name: Upload Finished APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SatChannelEditor-Pro-APK
          path: bin/*.apk
