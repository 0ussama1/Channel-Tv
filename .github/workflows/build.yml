name: Build Android APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Buildozer and Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev libsqlite3-dev lld
          pip install --upgrade pip
          pip install "cython<3.0.0" buildozer
          
      - name: Manual Android SDK/NDK Setup
        run: |
          # تجاوز الفحص التلقائي وتهيئة البيئة يدوياً
          mkdir -p ~/.buildozer/android/platform
          export ANDROID_HOME=$HOME/android-sdk
          export NDK_HOME=$HOME/android-ndk
          echo "SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          echo "NDK_ROOT=$NDK_HOME" >> $GITHUB_ENV

      - name: Build APK
        run: |
          # استخدام وضع التجميع المباشر وتخطي أي تحديث للمستودعات
          buildozer android debug
        env:
          ANDROID_HOME: /home/runner/android-sdk
          NDK_HOME: /home/runner/android-ndk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SatChannelEditor-Pro-APK
          path: bin/*.apk
